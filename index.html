<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFC73B">
  <meta name="robots" content="noindex">
  <title>Swipe4Work – feed-prototype</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone" id="phone">
    <header class="topbar" id="topbar" hidden>
      <img src="logo.svg" alt="Swipe4Work" class="logo" width="105" height="21">
      <button class="btn-mini" id="doneBtn" hidden>Klaar</button>
    </header>
    <main id="main"></main>
    <nav class="tabs" id="tabs" hidden aria-label="Weergave">
      <button data-tab="feed" class="tab active">Vacatures</button>
      <button data-tab="shortlist" class="tab">Mijn lijst <span class="badge" id="tabBadge" hidden>0</span></button>
    </nav>
    <div id="sheetRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="debug" id="debug" hidden></div>

  <script src="config.js"></script>
  <script src="vacancies.js"></script>
  <script src="app.js"></script>
</body>
</html>
